<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./scripts.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="relative isolate min-h-screen overflow-hidden">
        <div class="absolute inset-0 -z-10 bg-gradient-to-br from-teal-50 via-sky-100 to-cyan-200"></div>
        <div class="absolute -left-24 top-20 -z-10 h-72 w-72 rounded-full bg-cyan-300/40 blur-3xl"></div>
        <div class="absolute -right-16 bottom-10 -z-10 h-80 w-80 rounded-full bg-teal-300/40 blur-3xl"></div>

        <section class="mx-auto grid min-h-screen w-full max-w-[96vw] grid-cols-1 gap-4 p-3 sm:p-4 lg:grid-cols-3 lg:gap-5 lg:p-4 xl:max-w-[98vw]">
            <article class="rounded-3xl border border-white/70 bg-white/80 p-6 shadow-2xl shadow-cyan-900/10 backdrop-blur lg:col-span-1">
                <div class="flex h-full flex-col gap-6">
                    <div>
                        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-700">Panel principal</p>
                        <h1 class="mt-2 text-4xl font-black text-slate-900 sm:text-5xl lg:text-6xl">Bingo en vivo</h1>
                    </div>

                    <div class="rounded-2xl bg-slate-900 p-6 text-center text-white shadow-lg shadow-slate-900/30">
                        <p class="text-base font-semibold uppercase tracking-[0.22em] text-slate-300 lg:text-lg">Ultimo numero</p>
                        <p class="mt-3 text-8xl font-black leading-none sm:text-9xl lg:text-[10rem]" id="currentNumber">0</p>
                        <p id="status" class="mt-4 inline-flex rounded-full bg-white/15 px-5 py-2 text-base font-semibold lg:text-lg">Sin Iniciar</p>
                    </div>

                    <div class="grid grid-cols-1 gap-3">
                        <button id="primaryAction" class="rounded-xl bg-emerald-500 px-4 py-3 text-base font-bold uppercase tracking-wide text-white shadow-lg shadow-emerald-500/30 transition hover:bg-emerald-600 disabled:cursor-not-allowed disabled:bg-emerald-300 disabled:shadow-none disabled:opacity-60 lg:py-4 lg:text-lg" onclick="resetGame()">Iniciar Juego</button>
                        <button id="pauseAction" class="rounded-xl bg-orange-500 px-4 py-3 text-base font-bold uppercase tracking-wide text-white shadow-lg shadow-orange-500/30 transition hover:bg-orange-600 disabled:cursor-not-allowed disabled:bg-orange-300 disabled:shadow-none disabled:opacity-60 lg:py-4 lg:text-lg" onclick="pauseGame()">Pausar Juego</button>
                        <button id="resumeAction" class="rounded-xl bg-blue-500 px-4 py-3 text-base font-bold uppercase tracking-wide text-white shadow-lg shadow-blue-500/30 transition hover:bg-blue-600 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:shadow-none disabled:opacity-60 lg:py-4 lg:text-lg" onclick="resumeGame()">Reanudar Juego</button>
                    </div>

                    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-1">
                        <label class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                            <span class="text-sm font-semibold uppercase tracking-wide text-slate-500 lg:text-base">Tiempo entre numeros (segundos)</span>
                            <input type="number" id="timer" class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 p-3 text-lg font-semibold text-slate-900 outline-none ring-cyan-300 transition focus:ring-2 lg:p-4 lg:text-xl" value="5">
                        </label>
                        <label class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                            <span class="text-sm font-semibold uppercase tracking-wide text-slate-500 lg:text-base">Numero de opciones</span>
                            <input type="number" id="options" class="mt-2 w-full rounded-lg border border-slate-200 bg-slate-50 p-3 text-lg font-semibold text-slate-900 outline-none ring-cyan-300 transition focus:ring-2 lg:p-4 lg:text-xl" value="90">
                        </label>
                        <label class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm flex items-center justify-between">
                            <span class="text-sm font-semibold uppercase tracking-wide text-slate-500 lg:text-base">Anunciar numero por voz</span>
                            <span class="mt-2 inline-flex items-center gap-3 text-base font-semibold text-slate-700 lg:text-lg">
                                <input type="checkbox" id="speechEnabled" class="h-5 w-5 rounded border-slate-300 text-cyan-600 focus:ring-cyan-500" checked>
                                Si/No
                            </span>
                        </label>
                    </div>

                    <div class="mt-auto rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
                        <p class="text-sm font-semibold uppercase tracking-wide text-slate-500 lg:text-base">Siguiente numero en</p>
                        <div class="mt-3 flex items-center gap-4">
                            <div class="relative h-24 w-24 lg:h-28 lg:w-28">
                                <svg class="h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
                                    <circle cx="50" cy="50" r="42" class="fill-none stroke-slate-200" stroke-width="10"></circle>
                                    <circle id="countdownRing" cx="50" cy="50" r="42" class="fill-none stroke-cyan-500 transition-[stroke-dashoffset] duration-150 ease-linear" stroke-width="10" stroke-linecap="round" transform="rotate(-90 50 50)"></circle>
                                </svg>
                                <div class="absolute inset-0 grid place-items-center">
                                    <span id="countdownSeconds" class="text-3xl font-black text-slate-900 lg:text-4xl">0</span>
                                </div>
                            </div>
                            <p class="text-base font-semibold text-slate-700 lg:text-lg">segundos restantes</p>
                        </div>
                    </div>
                </div>
            </article>

            <article class="rounded-3xl border border-white/70 bg-white/85 p-6 shadow-2xl shadow-cyan-900/10 backdrop-blur lg:col-span-2">
                <div class="flex h-full flex-col gap-5">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-cyan-700">Historial</p>
                            <h2 class="text-3xl font-black text-slate-900 sm:text-4xl lg:text-5xl">Numeros tomados</h2>
                        </div>
                        <label class="inline-flex cursor-pointer items-center gap-3 rounded-full border border-slate-200 bg-white px-5 py-3 text-base font-medium text-slate-700 shadow-sm lg:text-lg">
                            <input type="checkbox" class="h-5 w-5 rounded border-slate-300 text-cyan-600 focus:ring-cyan-500" onchange="changeSort()">
                            Mostrar ordenados
                        </label>
                    </div>

                    <div class="grow rounded-2xl border border-slate-200 bg-gradient-to-br from-white to-cyan-50 p-4 sm:p-6">
                        <div class="grid grid-cols-3 gap-2 text-center text-2xl font-extrabold text-slate-800 sm:grid-cols-5 sm:gap-3 sm:text-3xl md:grid-cols-6 lg:grid-cols-7 lg:text-4xl xl:grid-cols-8" id="numbersTaken"></div>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
